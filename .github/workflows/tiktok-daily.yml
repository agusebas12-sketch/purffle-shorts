
name: TikTok Daily

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  publicar-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar el último Short de YouTube
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RUN_DATA=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/daily-short.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.run_number)"')
          test -n "$RUN_DATA"
          RUN_ID=$(echo "$RUN_DATA" | awk '{print $1}')
          RUN_NUMBER=$(echo "$RUN_DATA" | awk '{print $2}')
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Descargar el Short
        uses: actions/download-artifact@v4
        with:
          name: short-${{ env.RUN_NUMBER }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: video

      - name: Enviar vídeo a TikTok en privado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          VIDEO=$(find video -type f -name '*.mp4' -print -quit)
          test -n "$VIDEO"

          TOKEN=$(curl -fsS \
            "$SUPABASE_URL/rest/v1/tiktok_tokens?select=access_token&id=eq.1" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            | jq -er '.[0].access_token')

          SIZE=$(stat -c%s "$VIDEO")

          RESPONSE=$(jq -n \
            --argjson size "$SIZE" \
            '{
              post_info: {
                title: "Short de Misterios y Curiosidades",
                privacy_level: "SELF_ONLY",
                disable_duet: true,
                disable_comment: true,
                disable_stitch: true,
                is_aigc: true
              },
              source_info: {
                source: "FILE_UPLOAD",
                video_size: $size,
                chunk_size: $size,
                total_chunk_count: 1
              }
            }' | curl -fsS \
              https://open.tiktokapis.com/v2/post/publish/video/init/ \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d @-)

          echo "$RESPONSE" | jq .
          UPLOAD_URL=$(echo "$RESPONSE" | jq -er '.data.upload_url')
          PUBLISH_ID=$(echo "$RESPONSE" | jq -er '.data.publish_id')

          curl -fsS -X PUT "$UPLOAD_URL" \
            -H "Content-Type: video/mp4" \
            -H "Content-Length: $SIZE" \
            -H "Content-Range: bytes 0-$((SIZE - 1))/$SIZE" \
            --data-binary "@$VIDEO"

          echo "TikTok recibió el vídeo. ID: $PUBLISH_ID"
          
