
name: Daily Real Stories Documentary

on:
  workflow_dispatch:
  schedule:
    # 13:00 y 20:00 hora peninsular española.
    # Se contemplan los horarios UTC de verano e invierno.
    - cron: "0 11,12,18,19 * * *"

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.5-flash-lite
      LLM_JSON_SCHEMA: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Elegir tema de historia real o documental
        id: topic
        shell: bash
        run: |
          topics=(
            "Documental: el vuelo MH370 y la búsqueda que continúa"
            "Documental: el misterio del Mary Celeste, barco encontrado sin tripulación"
            "Documental: el paso Dyatlov, reconstrucción de los hechos"
            "Documental: Amelia Earhart y su último vuelo"
            "Documental: D. B. Cooper, el secuestro aéreo sin resolver"
            "Documental: la expedición Franklin y el destino de sus barcos"
            "Documental: la colonia perdida de Roanoke"
            "Documental: el faro de Flannan y sus tres fareros desaparecidos"
            "Documental: la señal Wow y la búsqueda de vida extraterrestre"
            "Documental: Tunguska, la explosión que arrasó un bosque"
            "Documental: los niños Sodder y la desaparición que marcó a una familia"
            "Documental: el zumbido de Taos y sus posibles explicaciones"
            "Historia real: los 33 mineros de Chile y 69 días bajo tierra"
            "Historia real: Juliane Koepcke, la joven que cayó de un avión y sobrevivió"
            "Historia real: la tragedia de los Andes y la lucha por sobrevivir"
            "Historia real: Shackleton y la expedición Endurance en la Antártida"
            "Historia real: Apollo 13 y cómo evitaron una tragedia en el espacio"
            "Historia real: Poon Lim y 133 días perdido en el océano"
            "Historia real: Harrison Okene y el rescate bajo el mar"
            "Historia real: Aron Ralston y su supervivencia en un cañón"
            "Documental: la erupción del Vesubio y la destrucción de Pompeya"
            "Documental: el desastre del Hindenburg y las investigaciones"
            "Historia real: el rescate de los supervivientes de la cueva Tham Luang"
            "Documental: el incendio del dirigible LZ 129 y sus consecuencias"
          )

          hour=$(TZ=Europe/Madrid date +%H)

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ "$hour" != "13" && "$hour" != "20" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Ejecución fuera del horario español. Se omite."
              exit 0
            fi
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

          day=$(TZ=Europe/Madrid date +%j)

          if (( 10#$hour < 17 )); then
            slot=0
          else
            slot=1
          fi

          index=$(( ((10#$day - 1) * 2 + slot) % ${#topics[@]} ))
          topic="${topics[$index]}"

          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "Tema elegido: $topic"

      - name: Descargar repositorio
        if: steps.topic.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Instalar Python
        if: steps.topic.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg
        if: steps.topic.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restaurar autorización de YouTube
        if: steps.topic.outputs.run == 'true'
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          test -n "$YOUTUBE_TOKEN_JSON_B64" || {
            echo "Falta YOUTUBE_TOKEN_JSON_B64"
            exit 1
          }

          printf '%s' "$YOUTUBE_TOKEN_JSON_B64" | base64 --decode > "$RUNNER_TEMP/token.json"
          python -m json.tool "$RUNNER_TEMP/token.json" > /dev/null
          chmod 600 "$RUNNER_TEMP/token.json"

      - name: Instalar Purffle Shorts
        if: steps.topic.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Comprobar Gemini
        if: steps.topic.outputs.run == 'true'
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "Falta GEMINI_API_KEY"
            exit 1
          }

      - name: Generar y publicar documental de historia real
        if: steps.topic.outputs.run == 'true'
        shell: bash
        env:
          UPLOAD: "true"
          PUBLISH_TO: "youtube"
          YT_TOKEN_FILE: ${{ runner.temp }}/token.json
          KEEP_VIDEOS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          mkdir -p output_videos

          for intento in 1 2 3; do
            echo "Intento $intento de 3"

            if purffle-shorts make \
              --style story \
              --lang es \
              --duration 172 \
              --aspect 16:9 \
              --visuals pixabay \
              --verbose \
              --topic "${{ steps.topic.outputs.topic }}"; then

              echo "Generación y publicación completadas."
              exit 0
            fi

            if [ "$intento" -lt 3 ]; then
              echo "Esperando 60 segundos..."
              sleep 60
            fi
          done

          echo "ERROR: fallaron los tres intentos."
          exit 1

      - name: Guardar vídeo generado
        if: always() && steps.topic.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-historias-reales-${{ github.run_number }}
          path: output_videos/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
          
