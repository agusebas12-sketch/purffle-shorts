
name: Daily Long Mystery Video

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Prueba: mantener desactivada la publicación"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-long-mystery-video
  cancel-in-progress: false

jobs:
  create-long-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LLM_PROVIDER: groq
      LLM_MODEL: llama-3.3-70b-versatile
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar PurffleShorts
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Comprobar configuración
        shell: bash
        run: |
          set -e

          if [ -z "$GROQ_API_KEY" ]; then
            echo "Error: falta el secreto GROQ_API_KEY."
            exit 1
          fi

          echo "Clave de Groq configurada."
          echo "Proveedor: $LLM_PROVIDER"
          echo "Modelo: $LLM_MODEL"
          echo "Pixabay configurado: $([ -n "$PIXABAY_API_KEY" ] && echo sí || echo no)"
          echo "Pexels configurado: $([ -n "$PEXELS_API_KEY" ] && echo sí || echo no)"

      - name: Generar vídeo de 170 segundos
        shell: bash
        run: |
          set -e
          purffle-shorts make \
            --style explainer \
            --lang es \
            --duration 170 \
            --aspect 16:9 \
            --visuals pixabay \
            --no-upload \
            --verbose \
            --topic "El origen de las señales misteriosas del espacio"

      - name: Validar vídeo generado
        shell: bash
        run: |
          set -e
          echo "Buscando el vídeo generado..."
          find output_videos -type f -name "*.mp4" -size +1M -print

          if ! find output_videos -type f -name "*.mp4" -size +1M -print -quit | grep -q .; then
            echo "Error: no se encontró un vídeo MP4 válido."
            exit 1
          fi

          echo "Vídeo encontrado correctamente."

      - name: Guardar vídeo para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-largo-${{ github.run_number }}
          path: output_videos/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
          
