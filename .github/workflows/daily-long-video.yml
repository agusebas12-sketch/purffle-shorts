name: Daily Long Mystery Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.8-flash
      LLM_JSON_SCHEMA: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Purffle Shorts
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Comprobar clave de Gemini
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Falta el secreto GEMINI_API_KEY en GitHub Actions."
            exit 1
          fi
          echo "Clave de Gemini configurada."

      - name: Verificar configuración de Gemini
        run: |
          python - <<'PY'
          import os
          from purffle_shorts.llm import PRESETS, OpenAICompatible

          preset = PRESETS["gemini"]
          provider = OpenAICompatible(
              preset,
              os.environ["LLM_MODEL"],
              "test-key",
              preset.base_url,
          )

          if not provider._schema_mode:
              raise SystemExit(
                  "ERROR: el modo JSON Schema no está activado."
              )

          print("OK: proveedor Gemini configurado.")
          print("Modelo:", os.environ["LLM_MODEL"])
          PY

      - name: Generar vídeo
        run: |
          mkdir -p output_videos
          purffle-shorts make \
            --style explainer \
            --lang es \
            --duration 170 \
            --aspect 16:9 \
            --visuals pixabay \
            --no-upload \
            --verbose \
            --topic "El origen de las señales misteriosas del espacio"

      - name: Guardar vídeo generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-largo
          path: output_videos/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
