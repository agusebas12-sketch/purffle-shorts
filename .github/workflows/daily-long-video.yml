
name: Daily Long Tech and AI Video

on:
  workflow_dispatch:
  schedule:
    # 13:00 y 20:00 hora peninsular española.
    # Se contemplan los horarios UTC de verano e invierno.
    - cron: "0 11,12,18,19 * * *"

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.5-flash-lite
      LLM_JSON_SCHEMA: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Elegir tema de tecnología e IA
        id: topic
        shell: bash
        run: |
          topics=(
            "Cómo aprovechar ChatGPT para trabajar y estudiar mejor"
            "Trucos útiles de Android que mucha gente desconoce"
            "Herramientas gratuitas de inteligencia artificial"
            "Cómo crear imágenes con inteligencia artificial"
            "Funciones de ChatGPT que ahorran tiempo"
            "Cómo proteger tu móvil de aplicaciones peligrosas"
            "Aplicaciones gratuitas que merece la pena conocer"
            "Cómo automatizar tareas repetitivas con IA"
            "Trucos para mejorar la seguridad de tus cuentas"
            "Cómo usar la inteligencia artificial para aprender"
            "Herramientas de IA para crear vídeos desde el móvil"
            "Cómo detectar imágenes y vídeos falsos creados con IA"
            "Funciones ocultas de Google que pueden ayudarte"
            "Cómo mejorar la privacidad de tu teléfono Android"
            "Trucos para sacar más partido a WhatsApp"
            "Cómo crear textos profesionales con inteligencia artificial"
            "Herramientas gratuitas para editar vídeos desde Android"
            "Cómo organizar tu trabajo usando ChatGPT"
            "Errores que debes evitar al usar inteligencia artificial"
            "Novedades tecnológicas explicadas de forma sencilla"
          )

          hour=$(TZ=Europe/Madrid date +%H)

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            if [[ "$hour" != "13" && "$hour" != "20" ]]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Ejecución fuera del horario español. Se omite."
              exit 0
            fi
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

          day=$(TZ=Europe/Madrid date +%j)

          if (( 10#$hour < 17 )); then
            slot=0
          else
            slot=1
          fi

          index=$(( ((10#$day - 1) * 2 + slot) % ${#topics[@]} ))
          topic="${topics[$index]}"

          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "Tema elegido: $topic"

      - name: Descargar repositorio
        if: steps.topic.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Instalar Python
        if: steps.topic.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg
        if: steps.topic.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restaurar autorización de YouTube
        if: steps.topic.outputs.run == 'true'
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          test -n "$YOUTUBE_TOKEN_JSON_B64" || {
            echo "Falta YOUTUBE_TOKEN_JSON_B64"
            exit 1
          }

          printf '%s' "$YOUTUBE_TOKEN_JSON_B64" | base64 --decode > "$RUNNER_TEMP/token.json"
          python -m json.tool "$RUNNER_TEMP/token.json" > /dev/null
          chmod 600 "$RUNNER_TEMP/token.json"

      - name: Instalar Purffle Shorts
        if: steps.topic.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Comprobar Gemini
        if: steps.topic.outputs.run == 'true'
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "Falta GEMINI_API_KEY"
            exit 1
          }

      - name: Generar y publicar vídeo tecnológico horizontal
        if: steps.topic.outputs.run == 'true'
        shell: bash
        env:
          UPLOAD: "true"
          PUBLISH_TO: "youtube"
          YT_TOKEN_FILE: ${{ runner.temp }}/token.json
          KEEP_VIDEOS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          mkdir -p output_videos

          for intento in 1 2 3; do
            echo "Intento $intento de 3"

            if purffle-shorts make \
              --style explainer \
              --lang es \
              --duration 172 \
              --aspect 16:9 \
              --visuals pixabay \
              --verbose \
              --topic "${{ steps.topic.outputs.topic }}"; then

              echo "Generación y publicación completadas."
              exit 0
            fi

            if [ "$intento" -lt 3 ]; then
              echo "Esperando 60 segundos..."
              sleep 60
            fi
          done

          echo "ERROR: fallaron los tres intentos."
          exit 1

      - name: Guardar vídeo generado
        if: always() && steps.topic.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-tecnologia-${{ github.run_number }}
          path: output_videos/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
          
