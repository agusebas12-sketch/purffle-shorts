name: Daily Long Mystery Video

on:
  workflow_dispatch:
  schedule:
    # 13:00 y 20:00 hora peninsular española (invierno)
    - cron: "0 12,19 * * *"

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.5-flash-lite
      LLM_JSON_SCHEMA: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Elegir tema
        id: topic
        shell: bash
        run: |
          topics=(
            "El misterio de las señales de radio que llegan desde el espacio"
            "Lugares de la Tierra donde ocurren fenómenos inexplicables"
            "La historia real detrás de una desaparición misteriosa"
            "Descubrimientos arqueológicos que todavía desconciertan"
            "Fenómenos naturales que parecen imposibles"
            "Mensajes y señales misteriosas que nadie ha podido explicar"
            "Misterios del océano que siguen sin resolverse"
            "Objetos antiguos cuyo origen sigue siendo un enigma"
            "Extraños sucesos históricos documentados"
            "Misterios del universo que intrigan a los científicos"
            "Civilizaciones antiguas y sus secretos"
            "Casos curiosos que cambiaron la historia"
            "Fenómenos extraños observados en distintos países"
            "Enigmas científicos que todavía buscan respuesta"
          )

          day=$(date -u +%j)
          hour=$(date -u +%H)

          if (( 10#$hour < 15 )); then
            slot=0
          else
            slot=1
          fi

          index=$(( ((10#$day - 1) * 2 + slot) % ${#topics[@]} ))
          topic="${topics[$index]}"

          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "Tema elegido: $topic"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Restaurar autorización de YouTube
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          test -n "$YOUTUBE_TOKEN_JSON_B64" || {
            echo "Falta YOUTUBE_TOKEN_JSON_B64"
            exit 1
          }

          printf '%s' "$YOUTUBE_TOKEN_JSON_B64" | base64 --decode > "$RUNNER_TEMP/token.json"
          python -m json.tool "$RUNNER_TEMP/token.json" > /dev/null
          chmod 600 "$RUNNER_TEMP/token.json"

      - name: Instalar Purffle Shorts
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Comprobar Gemini
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "Falta GEMINI_API_KEY"
            exit 1
          }

      - name: Generar y publicar vídeo normal de 120 segundos
        shell: bash
        env:
          UPLOAD: "true"
          PUBLISH_TO: "youtube"
          YT_TOKEN_FILE: ${{ runner.temp }}/token.json
          KEEP_VIDEOS: "true"
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          mkdir -p output_videos

          for intento in 1 2 3; do
            echo "Intento $intento de 3"

            if purffle-shorts make \
              --style explainer \
              --lang es \
              --duration 120 \
              --aspect 16:9 \
              --visuals pixabay \
              --verbose \
              --topic "${{ steps.topic.outputs.topic }}"; then

              echo "Generación y publicación completadas."
              exit 0
            fi

            if [ "$intento" -lt 3 ]; then
              echo "Esperando 60 segundos..."
              sleep 60
            fi
          done

          echo "ERROR: fallaron los tres intentos."
          exit 1

      - name: Guardar vídeo generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-largo-${{ github.run_number }}
          path: output_videos/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
