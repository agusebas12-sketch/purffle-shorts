
name: Daily Long Mystery Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-long-mystery-video
  cancel-in-progress: false

jobs:
  create-long-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-120b
      LLM_JSON_SCHEMA: "0"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar PurffleShorts
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Desactivar JSON forzado en Groq
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import purffle_shorts.llm as llm

          path = Path(llm.__file__)
          source = path.read_text(encoding="utf-8")
          old = "elif schema is not None and self._json_mode:"
          new = "elif schema is not None and self._json_mode and self.name != 'groq':"

          if source.count(old) != 1:
              raise SystemExit("No se encontró la línea esperada en llm.py.")

          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          print("Configuración de Groq corregida.")

          PY

      - name: Comprobar configuración
        run: |
          set -e
          test -n "$GROQ_API_KEY"
          echo "Configuración comprobada."

      - name: Generar vídeo
        run: |
          purffle-shorts make \
            --style explainer \
            --lang es \
            --duration 170 \
            --aspect 16:9 \
            --visuals pixabay \
            --no-upload \
            --verbose \
            --topic "El origen de las señales misteriosas del espacio"

      - name: Guardar vídeo para descargar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-largo-${{ github.run_number }}
          path: output_videos/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
          
