
name: Daily Long Mystery Video

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

jobs:
  generar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      LLM_PROVIDER: groq
      LLM_MODEL: openai/gpt-oss-120b
      LLM_JSON_SCHEMA: "0"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Purffle Shorts
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Comprobar clave de Groq
        shell: bash
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Falta el secreto GROQ_API_KEY en GitHub."
            exit 1
          fi
          echo "Clave de Groq configurada."

      - name: Corregir compatibilidad de Groq y GPT-OSS
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import purffle_shorts.llm as llm

          path = Path(llm.__file__)
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "self._json_mode = preset.json_mode",
                  'self._json_mode = preset.json_mode and preset.name != "groq"',
              ),
              (
                  'self._schema_mode = preset.schema_mode and os.getenv("LLM_JSON_SCHEMA", "true").lower() not in ("0", "false")',
                  'self._schema_mode = preset.name != "groq" and preset.schema_mode and os.getenv("LLM_JSON_SCHEMA", "true").lower() not in ("0", "false")',
              ),
              (
                  'return bool(re.match(r"^(o\\d|gpt-5)", self.model.split("/")[-1]))',
                  'return bool(re.match(r"^(o\\d|gpt-5|gpt-oss)", self.model.split("/")[-1]))',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Error: se esperaba encontrar una vez el texto: {old!r}; encontrado: {count}"
                  )
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          print("Compatibilidad de Groq y GPT-OSS corregida.")
          PY

      - name: Verificar configuración corregida
        run: |
          python - <<'PY'
          import purffle_shorts.llm as llm

          provider = llm.OpenAICompatible(
              llm.PRESETS["groq"],
              "openai/gpt-oss-120b",
              "test-key",
              llm.PRESETS["groq"].base_url,
          )

          if not provider._is_reasoning_model():
              raise SystemExit("ERROR: GPT-OSS no se reconoce como modelo de razonamiento.")
          if provider._json_mode or provider._schema_mode:
              raise SystemExit("ERROR: los modos JSON incompatibles siguen activos.")

          print("OK: GPT-OSS reconocido y modos JSON incompatibles desactivados.")
          PY

      - name: Generar vídeo
        run: |
          mkdir -p output_videos
          purffle-shorts make \
            --style explainer \
            --lang es \
            --duration 170 \
            --aspect 16:9 \
            --visuals pixabay \
            --no-upload \
            --verbose \
            --topic "El origen de las señales misteriosas del espacio"

      - name: Guardar vídeo generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-largo
          path: output_videos/**/*.mp4
          if-no-files-found: warn
          retention-days: 7
          
