name: One-time Daily Spanish Short dispatcher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dispatch-short-once.yml"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.head_commit.message == 'dispatch: run Daily Spanish Short once'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the existing Short workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run daily-short.yml --ref main

      - name: Remove this one-time dispatcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/dispatch-short-once.yml"
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE" --jq .sha)
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/contents/$FILE" \
            -f message="chore: remove one-time workflow dispatcher" \
            -f sha="$SHA" -f branch=main
