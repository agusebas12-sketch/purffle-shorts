
name: Daily Spanish Short

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Choose today's real story or unexplained event
        id: topic
        shell: bash
        run: |
          topics=(
            "La desaparición del vuelo MH370: qué se sabe realmente"
            "El misterio del barco Mary Celeste"
            "La señal Wow: la extraña señal captada desde el espacio"
            "El paso Dyatlov: los hechos y las teorías"
            "El caso de D. B. Cooper y el salto sin resolver"
            "La desaparición de Amelia Earhart"
            "El incidente del faro de las islas Flannan"
            "El sonido inexplicable conocido como el zumbido de Taos"
            "El evento de Tunguska de 1908"
            "El mensaje de radio que interrumpió una emisión en 1977"
            "La historia real de los niños Sodder"
            "El misterio de la colonia perdida de Roanoke"
            "La expedición Franklin atrapada en el Ártico"
            "El rescate de los 33 mineros de Chile"
            "Juliane Koepcke: sobrevivir a una caída desde un avión"
            "La supervivencia de los Andes en 1972"
            "Aron Ralston: sobrevivir atrapado en un cañón"
            "Poon Lim: 133 días a la deriva en el océano"
            "Harrison Okene: sobrevivir bajo el mar"
            "Tsutomu Yamaguchi: sobrevivir a dos bombas atómicas"
            "La erupción del Vesubio y la ciudad de Pompeya"
            "La expedición de Shackleton y la supervivencia en la Antártida"
            "El rescate de Apollo 13: una misión al límite"
            "La historia real del desastre del dirigible Hindenburg"
          )

          day=$(date -u +%j)
          hour=$(date -u +%H)

          if (( 10#$hour < 12 )); then
            slot=0
          elif (( 10#$hour < 17 )); then
            slot=1
          else
            slot=2
          fi

          index=$(( ((10#$day - 1) * 3 + slot) % ${#topics[@]} ))
          topic="${topics[$index]}"

          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "Tema elegido: $topic"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Restore YouTube authorization
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          test -n "$YOUTUBE_TOKEN_JSON_B64" || {
            echo "Falta el secreto de YouTube"
            exit 1
          }
          printf '%s' "$YOUTUBE_TOKEN_JSON_B64" | base64 --decode > "$RUNNER_TEMP/token.json"
          python -m json.tool "$RUNNER_TEMP/token.json" > /dev/null
          chmod 600 "$RUNNER_TEMP/token.json"

      - name: Install PurffleShorts
        run: python -m pip install .

      - name: Generate and upload Spanish real-story Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-3.5-flash-lite
          LANGUAGE: es
          SCRIPT_STYLE: story
          TARGET_SECONDS: "40"
          CAPTION_STYLE: bold
          VISUAL_SOURCES: pixabay-photos
          PYTHONUNBUFFERED: "1"
          UPLOAD: "true"
          PUBLISH_TO: "youtube"
          YT_TOKEN_FILE: ${{ runner.temp }}/token.json
          KEEP_VIDEOS: "true"
        run: |
          purffle-shorts make \
            --style story \
            --lang es \
            --duration 40 \
            --caption-style bold \
            --visuals pixabay-photos \
            --verbose \
            --topic "${{ steps.topic.outputs.topic }}"

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output_videos/**/*.mp4
          if-no-files-found: error
          retention-days: 7
