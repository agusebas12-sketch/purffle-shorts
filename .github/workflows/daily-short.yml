
name: Daily Spanish Short

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Choose today's topic
        id: topic
        shell: bash
        run: |
          topics=(
            "animales sorprendentes"
            "misterios del océano"
            "curiosidades científicas"
            "misterios del espacio"
            "civilizaciones antiguas"
            "inventos que cambiaron el mundo"
            "el cuerpo humano"
            "psicología cotidiana"
            "inteligencia artificial y tecnología"
            "fenómenos naturales"
            "enigmas históricos"
            "lugares extraordinarios"
            "experimentos científicos"
            "mitos explicados por la ciencia"
            "descubrimientos arqueológicos"
            "ingeniería sorprendente"
            "curiosidades sobre alimentos"
            "récords extraordinarios"
            "misterios de la Tierra"
            "historias de supervivencia"
          )

          day=$(date -u +%j)
          hour=$(date -u +%H)

          if (( 10#$hour < 12 )); then
            slot=0
          elif (( 10#$hour < 17 )); then
            slot=1
          else
            slot=2
          fi

          index=$(( ((10#$day - 1) * 3 + slot) % ${#topics[@]} ))
          topic="${topics[$index]}"

          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "Tema elegido: $topic"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Restore YouTube authorization
        env:
          YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          test -n "$YOUTUBE_TOKEN_JSON_B64" || {
            echo "Falta el secreto de YouTube"
            exit 1
          }
          printf '%s' "$YOUTUBE_TOKEN_JSON_B64" | base64 --decode > "$RUNNER_TEMP/token.json"
          python -m json.tool "$RUNNER_TEMP/token.json" > /dev/null
          chmod 600 "$RUNNER_TEMP/token.json"

      - name: Install PurffleShorts
        run: python -m pip install .

      - name: Generate and upload Spanish Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-3.5-flash-lite
          LANGUAGE: es
          SCRIPT_STYLE: facts
          TARGET_SECONDS: "40"
          CAPTION_STYLE: bold
          VISUAL_SOURCES: pixabay-photos
          PYTHONUNBUFFERED: "1"
          UPLOAD: "true"
          PUBLISH_TO: "youtube"
          YT_TOKEN_FILE: ${{ runner.temp }}/token.json
          KEEP_VIDEOS: "true"
        run: |
          purffle-shorts make \
            --style facts \
            --lang es \
            --duration 40 \
            --caption-style bold \
            --visuals pixabay-photos \
            --verbose \
            --topic "${{ steps.topic.outputs.topic }}"

      - name: Save video for download
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: output_videos/**/*.mp4
          if-no-files-found: error
          retention-days: 7
