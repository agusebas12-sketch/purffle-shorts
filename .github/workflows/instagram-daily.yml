
name: Instagram Daily

on:
  workflow_dispatch:

jobs:
  probar-subida-cloudinary:
    runs-on: ubuntu-latest
    steps:
      - name: Crear vídeo de prueba
        run: |
          ffmpeg -f lavfi -i color=c=blue:s=320x240:d=2 \
            -f lavfi -i anullsrc=r=44100:cl=stereo \
            -shortest -c:v libx264 -pix_fmt yuv420p \
            -c:a aac video-prueba.mp4

      - name: Subir vídeo a Cloudinary
        id: upload
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          response=$(curl -sS \
            --user "$API_KEY:$API_SECRET" \
            -F "file=@video-prueba.mp4" \
            -F "resource_type=video" \
            "https://api.cloudinary.com/v1_1/$CLOUD_NAME/video/upload")

          echo "$response" | jq '{public_id, resource_type, format, secure_url}'

          url=$(echo "$response" | jq -r '.secure_url // empty')
          if [ -z "$url" ]; then
            echo "Error: Cloudinary no devolvió una URL."
            exit 1
          fi

          echo "La subida terminó correctamente."
          echo "URL disponible para la siguiente etapa."
          
