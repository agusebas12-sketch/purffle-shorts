
name: Instagram Daily

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  preparar-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el Short de YouTube
        uses: actions/download-artifact@v4
        with:
          name: short-7
          repository: agusebas12-sketch/purffle-shorts
          run-id: 40350058912
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: video

      - name: Comprobar el archivo
        run: |
          set -e
          find video -type f -name '*.mp4'
          test -n "$(find video -type f -name '*.mp4' -print -quit)"

      - name: Subir el vídeo a Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -e
          VIDEO=$(find video -type f -name '*.mp4' -print -quit)
          RESPONSE=$(curl -sS \
            --user "$API_KEY:$API_SECRET" \
            -X POST \
            -F "file=@$VIDEO" \
            -F "resource_type=video" \
            "https://api.cloudinary.com/v1_1/$CLOUD_NAME/video/upload")
          URL=$(python -c 'import json,sys; print(json.load(sys.stdin).get("secure_url",""))' <<< "$RESPONSE")
          if [ -z "$URL" ]; then
            echo "No se pudo confirmar la subida a Cloudinary."
            exit 1
          fi
          echo "Subida a Cloudinary completada."
          echo "URL disponible para el siguiente paso."
          
