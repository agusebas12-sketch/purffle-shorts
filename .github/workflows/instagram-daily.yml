name: Instagram Daily

on:
  workflow_dispatch:

jobs:
  comprobar-accesos:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/cloudinary.json -w "%{http_code}" \
            --user "$API_KEY:$API_SECRET" \
            "https://api.cloudinary.com/v1_1/$CLOUD_NAME/resources/video?max_results=1")
          if [ "$code" = "200" ]; then
            echo "Cloudinary: credenciales válidas."
          else
            echo "Cloudinary: la comprobación falló (HTTP $code)."
            exit 1
          fi

      - name: Comprobar token de Instagram
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -e
          code=$(curl -sS -G -o /tmp/instagram.json -w "%{http_code}" \
            --data-urlencode "fields=id,username" \
            --data-urlencode "access_token=$IG_TOKEN" \
            "https://graph.instagram.com/me")
          if [ "$code" = "200" ]; then
            echo "Instagram: token aceptado."
          else
            echo "Instagram: la comprobación falló (HTTP $code)."
            exit 1
          fi
