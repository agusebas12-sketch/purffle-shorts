
name: Instagram Daily

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Spanish Short"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  publicar-reel:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Seleccionar el Short correcto
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          YOUTUBE_RUN_ID: ${{ github.event.workflow_run.id }}
          YOUTUBE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            RUN_ID="$YOUTUBE_RUN_ID"
            RUN_NUMBER="$YOUTUBE_RUN_NUMBER"
          else
            RUN_DATA=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/daily-short.yml/runs?status=success&per_page=1" \
              --jq '.workflow_runs[0] | "\(.id) \(.run_number)"')

            if [ -z "$RUN_DATA" ] || [ "$RUN_DATA" = "null null" ]; then
              echo "No se encontró una ejecución exitosa de YouTube."
              exit 1
            fi

            RUN_ID=$(echo "$RUN_DATA" | awk '{print $1}')
            RUN_NUMBER=$(echo "$RUN_DATA" | awk '{print $2}')
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Se descargará el Short de la ejecución $RUN_NUMBER."

      - name: Descargar el Short de YouTube
        uses: actions/download-artifact@v4
        with:
          name: short-${{ steps.latest.outputs.run_number }}
          repository: agusebas12-sketch/purffle-shorts
          run-id: ${{ steps.latest.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: video

      - name: Subir vídeo a Cloudinary
        id: cloudinary
        timeout-minutes: 4
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -e

          VIDEO=$(find video -type f -name '*.mp4' -print -quit)

          if [ -z "$VIDEO" ]; then
            echo "No se encontró ningún archivo MP4."
            exit 1
          fi

          ls -lh "$VIDEO"

          RESPONSE=$(curl -sS --connect-timeout 20 --max-time 180 \
            --user "$API_KEY:$API_SECRET" \
            -X POST \
            -F "file=@$VIDEO" \
            -F "resource_type=video" \
            -w '\nHTTP_STATUS:%{http_code}' \
            "https://api.cloudinary.com/v1_1/$CLOUD_NAME/video/upload")

          HTTP_STATUS=$(printf '%s\n' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(printf '%s\n' "$RESPONSE" | sed '/^HTTP_STATUS:/d')

          echo "Código HTTP de Cloudinary: $HTTP_STATUS"
          echo "$BODY"

          if [ -z "$HTTP_STATUS" ] || [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Error al subir el vídeo."
            exit 1
          fi

          URL=$(python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("secure_url",""))' <<< "$BODY")

          if [ -z "$URL" ]; then
            echo "Cloudinary no devolvió la URL del vídeo."
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Subida a Cloudinary completada."

      - name: Crear Reel en Instagram
        id: reel
        timeout-minutes: 2
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: "17841424470871658"
          VIDEO_URL: ${{ steps.cloudinary.outputs.url }}
        run: |
          set -e

          RESPONSE=$(curl -sS --connect-timeout 20 --max-time 60 \
            -X POST \
            --data-urlencode "media_type=REELS" \
            --data-urlencode "video_url=$VIDEO_URL" \
            --data-urlencode "caption=Un misterio que todavía sorprende. ¿Qué opinas? #misterios #curiosidades #shorts" \
            --data-urlencode "access_token=$IG_TOKEN" \
            "https://graph.instagram.com/v23.0/$IG_USER_ID/media")

          echo "Respuesta de Instagram:"
          echo "$RESPONSE"

          ID=$(python -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' <<< "$RESPONSE")

          if [ -z "$ID" ]; then
            echo "No se pudo crear el Reel. Revisa la respuesta de Instagram."
            exit 1
          fi

          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Reel creado. ID: $ID"

      - name: Esperar procesamiento del Reel
        timeout-minutes: 6
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CREATION_ID: ${{ steps.reel.outputs.id }}
        run: |
          set -e

          for i in $(seq 1 20); do
            RESPONSE=$(curl -sS --connect-timeout 20 --max-time 60 -G \
              --data-urlencode "fields=status_code" \
              --data-urlencode "access_token=$IG_TOKEN" \
              "https://graph.instagram.com/v23.0/$CREATION_ID")

            echo "Estado del procesamiento: $RESPONSE"

            STATUS=$(python -c 'import json,sys; print(json.load(sys.stdin).get("status_code",""))' <<< "$RESPONSE")

            if [ "$STATUS" = "FINISHED" ]; then
              echo "Instagram terminó de procesar el Reel."
              exit 0
            fi

            if [ "$STATUS" = "ERROR" ]; then
              echo "Instagram informó un error de procesamiento."
              exit 1
            fi

            sleep 15
          done

          echo "Instagram todavía no terminó de procesar el vídeo."
          exit 1

      - name: Publicar Reel
        timeout-minutes: 2
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: "17841424470871658"
          CREATION_ID: ${{ steps.reel.outputs.id }}
        run: |
          set -e

          RESPONSE=$(curl -sS --connect-timeout 20 --max-time 60 \
            -X POST \
            --data-urlencode "creation_id=$CREATION_ID" \
            --data-urlencode "access_token=$IG_TOKEN" \
            "https://graph.instagram.com/v23.0/$IG_USER_ID/media_publish")

          echo "Respuesta de publicación:"
          echo "$RESPONSE"

          ID=$(python -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' <<< "$RESPONSE")

          if [ -z "$ID" ]; then
            echo "Instagram no confirmó la publicación."
            exit 1
          fi

          echo "Reel publicado correctamente. ID: $ID"
          
