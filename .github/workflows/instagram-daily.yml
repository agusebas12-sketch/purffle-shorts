name: Instagram Daily

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar configuracion
        env:
          APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          APP_SECRET: ${{ secrets.INSTAGRAM_APP_SECRET }}
        run: |
          test -n "$APP_ID" || exit 1
          test -n "$APP_SECRET" || exit 1
          echo "Los dos secretos estan configurados."
