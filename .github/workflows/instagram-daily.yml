
name: Instagram Daily

on:
  workflow_dispatch:

jobs:
  check-instagram-token:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar token de Instagram
        env:
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_TOKEN" ]; then
            echo "Falta el secreto INSTAGRAM_ACCESS_TOKEN."
            exit 1
          fi

          response=$(curl -sS -G \
            --data-urlencode "fields=user_id,username" \
            --data-urlencode "access_token=$IG_TOKEN" \
            "https://graph.instagram.com/me")

          if echo "$response" | grep -q '"username"'; then
            echo "Token aceptado por la API de Instagram."
          else
            echo "Instagram no aceptó el token. Revisa el tipo de token y los permisos."
            exit 1
          fi
