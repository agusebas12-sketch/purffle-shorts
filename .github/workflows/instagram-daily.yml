name: Instagram Daily

on:
  workflow_dispatch:

jobs:
  probar-cloudinary:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar credenciales de Cloudinary
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -z "$CLOUD_NAME" ] || [ -z "$API_KEY" ] || [ -z "$API_SECRET" ]; then
            echo "Faltan secretos de Cloudinary."
            exit 1
          fi

          echo "Los tres secretos de Cloudinary están configurados."
