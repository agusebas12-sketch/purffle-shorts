<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conexión con Instagram</title>
</head>
<body>
  <h2>Conexión con Instagram</h2>
  <p id="estado">Procesando respuesta de Instagram...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const code = params.get("code");

    const estado = document.getElementById("estado");

    if (error) {
      estado.textContent = "La autorización fue cancelada o rechazada.";
    } else if (code) {
      estado.textContent =
        "Instagram devolvió un código de autorización. No lo compartas.";
    } else {
      estado.textContent =
        "Página de retorno preparada. Todavía no se ha autorizado Instagram.";
    }
  </script>
</body>
</html>
