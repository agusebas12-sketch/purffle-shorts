openapi: 3.1.0
info:
  title: Purffle Shorts GitHub Actions Dispatcher
  version: 1.0.0
  description: Starts only the approved YouTube workflows in the Purffle Shorts repository. Instagram follows automatically; TikTok is not exposed.
servers:
  - url: https://YOUR-RENDER-SERVICE.onrender.com
paths:
  /health:
    get:
      operationId: checkDispatcherHealth
      summary: Check dispatcher health
      responses:
        "200":
          description: Service health
  /actions/dispatch:
    post:
      operationId: dispatchPurffleWorkflow
      summary: Start an approved Purffle Shorts workflow
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - workflow
              properties:
                workflow:
                  type: string
                  enum:
                    - daily-short.yml
                    - daily-long-video.yml
      responses:
        "202":
          description: GitHub accepted the workflow dispatch
        "400":
          description: Workflow is not on the allowlist
        "401":
          description: Unauthorized
        "502":
          description: GitHub rejected the request or could not be reached
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
